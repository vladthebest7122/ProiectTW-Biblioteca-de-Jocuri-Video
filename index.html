<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameVault - Mockup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>GameVault</h1>
    <p>Gestionează-ți colecția de jocuri video și progresul lor.</p>
    <p class="app-count">3 jocuri, dintre care 2 neterminate</p>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Adaugă joc</h2>
      <form class="item-form">
        <label>Titlu 
          <input type="text" name="titlu" placeholder="Ex: The Witcher 3" />
        </label>
        <label>Platformă
          <select name="eticheta">
            <option value="pc">PC</option>
            <option value="playstation">PlayStation</option>
            <option value="xbox">Xbox</option>
            <option value="switch">Switch</option>
          </select>
        </label>
        <button type="submit">Adaugă</button>
      </form>
    </section>

    <section class="panel">
      <h2>Jocurile mele</h2>
      <!-- <p class="empty">Nu există niciun joc adăugat.</p> -->
      <ul class="item-list">
        <li class="item-card done">
          <div>
            <h3>The Witcher 3</h3>
            <span class="badge badge-pc">PC</span>
          </div>
          <span class="status">Terminat</span>
        </li>
        <li class="item-card">
          <div>
            <h3>God of War</h3>
            <span class="badge badge-playstation">PlayStation</span>
          </div>
          <span class="status">Neterminat</span>
        </li>
        <li class="item-card">
          <div>
            <h3>Halo Infinite</h3>
            <span class="badge badge-xbox">Xbox</span>
          </div>
          <span class="status">Neterminat</span>
        </li>
      </ul>
    </section>
  </main>

  <footer class="app-footer">Proiect Tehnologii Web</footer>
</body>
</html>
